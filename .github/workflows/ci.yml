name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-and-relay-tests:
    name: Web, Supabase & AI Endpoint Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Cloudflare Pages & Supabase Function tests
        run: node --test launch/tests/*.test.mjs launch/supabase/functions/eventbrite/*.test.mjs

  ios-build-and-test:
    name: iOS Build & Unit Tests
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Prepare Secrets.plist
        env:
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FEEDBACK_EMAIL: ${{ secrets.FEEDBACK_EMAIL }}
          SHARE_BASE_URL: ${{ secrets.SHARE_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          EVENTBRITE_PROXY_URL: ${{ secrets.EVENTBRITE_PROXY_URL }}
        run: bash ci_scripts/ci_post_clone.sh

      - name: Run iOS Unit Tests (Debug)
        run: |
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          for runtime in sorted(data.keys(), reverse=True):
              if "iOS" not in runtime: continue
              for dev in data[runtime]:
                  if dev.get("isAvailable") and "iPhone" in dev.get("name", ""):
                      print(dev["udid"]); sys.exit(0)
          ')
          echo "Testing on Simulator UDID: $SIM_ID"
          xcodebuild test \
            -project CityTourist.xcodeproj \
            -scheme CityTourist \
            -destination "platform=iOS Simulator,id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet

      - name: Verify iOS Release Build
        run: |
          xcodebuild build \
            -project CityTourist.xcodeproj \
            -scheme CityTourist \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet
